<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹贪吃蛇小游戏</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.78);
            --line: rgba(148, 163, 184, 0.2);
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --accent: #38bdf8;
            --danger: #fb7185;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 34%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.2), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .game-shell {
            width: min(100%, 760px);
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.08em;
            color: transparent;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(110px, 1fr));
            gap: 12px;
        }

        .stat-card {
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.62);
            text-align: center;
        }

        .stat-label {
            display: block;
            color: var(--muted);
            font-size: 0.86rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .board-wrap {
            position: relative;
            width: min(100%, 560px);
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1;
            display: block;
            border: 2px solid rgba(56, 189, 248, 0.45);
            border-radius: 20px;
            background: #020617;
            box-shadow: inset 0 0 28px rgba(56, 189, 248, 0.18), 0 0 34px rgba(34, 197, 94, 0.12);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            border-radius: 20px;
            background: rgba(2, 6, 23, 0.74);
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            margin: 0;
            font-size: clamp(1.7rem, 5vw, 3rem);
        }

        .overlay-text {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 22px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 12px 24px rgba(22, 163, 74, 0.28);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(22, 163, 74, 0.38);
        }

        .hint {
            width: 100%;
            margin: 6px 0 0;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }

        .mobile-pad {
            display: none;
            grid-template-columns: repeat(3, 58px);
            gap: 8px;
            justify-content: center;
            margin-top: 18px;
        }

        .mobile-pad button {
            width: 58px;
            height: 48px;
            padding: 0;
            border-radius: 14px;
            background: rgba(56, 189, 248, 0.22);
            box-shadow: none;
        }

        .mobile-pad .empty {
            visibility: hidden;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .game-shell {
                padding: 18px;
            }

            .stats {
                width: 100%;
            }

            .mobile-pad {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <main class="game-shell">
        <header>
            <div>
                <h1>贪吃蛇</h1>
                <p class="subtitle">吃掉红色食物让蛇变长，撞墙或撞到自己就会失败。</p>
            </div>
            <section class="stats" aria-label="游戏分数">
                <div class="stat-card">
                    <span class="stat-label">当前分数</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">最高分</span>
                    <span class="stat-value" id="bestScore">0</span>
                </div>
            </section>
        </header>

        <section class="board-wrap" aria-label="游戏区域">
            <canvas id="gameCanvas" width="560" height="560"></canvas>
            <div class="overlay" id="overlay">
                <h2 class="overlay-title" id="overlayTitle">准备开始</h2>
                <p class="overlay-text" id="overlayText">点击开始游戏，或按空格键开始。使用方向键 / WASD 控制移动。</p>
                <button id="overlayButton" type="button">开始游戏</button>
            </div>
        </section>

        <div class="controls">
            <button id="startButton" type="button">开始 / 暂停</button>
            <button id="restartButton" type="button">重新开始</button>
            <p class="hint">电脑：方向键或 WASD 控制，空格暂停。手机：使用下方按钮控制方向。</p>
        </div>

        <div class="mobile-pad" aria-label="手机方向键">
            <button class="empty" type="button" tabindex="-1"></button>
            <button type="button" data-direction="up">▲</button>
            <button class="empty" type="button" tabindex="-1"></button>
            <button type="button" data-direction="left">◀</button>
            <button type="button" data-direction="down">▼</button>
            <button type="button" data-direction="right">▶</button>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const overlayButton = document.getElementById('overlayButton');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const tickRate = 105;

        let snake;
        let food;
        let direction;
        let nextDirection;
        let score;
        let bestScore = Number(localStorage.getItem('snakeBestScore')) || 0;
        let gameTimer = null;
        let isRunning = false;
        let isGameOver = false;

        bestScoreEl.textContent = bestScore;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            isGameOver = false;
            scoreEl.textContent = score;
            placeFood();
            drawGame();
        }

        function startGame() {
            if (isGameOver) {
                resetGame();
            }

            overlay.classList.add('hidden');
            isRunning = true;
            clearInterval(gameTimer);
            gameTimer = setInterval(gameLoop, tickRate);
        }

        function pauseGame() {
            if (isGameOver) return;
            isRunning = false;
            clearInterval(gameTimer);
            showOverlay('已暂停', '按空格键或点击继续按钮回到游戏。', '继续游戏');
        }

        function toggleGame() {
            if (isRunning) {
                pauseGame();
            } else {
                startGame();
            }
        }

        function gameLoop() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (hasCollision(head)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > bestScore) {
                    bestScore = score;
                    bestScoreEl.textContent = bestScore;
                    localStorage.setItem('snakeBestScore', bestScore);
                }
                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function hasCollision(head) {
            const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
            const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
            return hitWall || hitSelf;
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function drawGame() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawFood();
            drawSnake();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                const position = i * gridSize;
                ctx.beginPath();
                ctx.moveTo(position, 0);
                ctx.lineTo(position, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, position);
                ctx.lineTo(canvas.width, position);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    (segment.x + 1) * gridSize,
                    (segment.y + 1) * gridSize
                );
                gradient.addColorStop(0, index === 0 ? '#86efac' : '#22c55e');
                gradient.addColorStop(1, index === 0 ? '#38bdf8' : '#16a34a');
                ctx.fillStyle = gradient;
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
            });
        }

        function drawFood() {
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            ctx.fillStyle = '#fb7185';
            ctx.shadowColor = '#fb7185';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(centerX, centerY, gridSize * 0.36, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function changeDirection(newDirection) {
            const isOpposite = newDirection.x + direction.x === 0 && newDirection.y + direction.y === 0;
            if (!isOpposite) {
                nextDirection = newDirection;
            }
        }

        function endGame() {
            isRunning = false;
            isGameOver = true;
            clearInterval(gameTimer);
            showOverlay('游戏结束', `本局得分：${score}。点击按钮再来一局！`, '再玩一次');
        }

        function showOverlay(title, text, buttonText) {
            overlayTitle.textContent = title;
            overlayText.textContent = text;
            overlayButton.textContent = buttonText;
            overlay.classList.remove('hidden');
        }

        document.addEventListener('keydown', (event) => {
            const keyMap = {
                ArrowUp: { x: 0, y: -1 },
                KeyW: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                KeyS: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                KeyA: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 },
                KeyD: { x: 1, y: 0 }
            };

            if (keyMap[event.code]) {
                event.preventDefault();
                changeDirection(keyMap[event.code]);
            }

            if (event.code === 'Space') {
                event.preventDefault();
                toggleGame();
            }
        });

        document.querySelectorAll('[data-direction]').forEach(button => {
            button.addEventListener('click', () => {
                const directions = {
                    up: { x: 0, y: -1 },
                    down: { x: 0, y: 1 },
                    left: { x: -1, y: 0 },
                    right: { x: 1, y: 0 }
                };
                changeDirection(directions[button.dataset.direction]);
                if (!isRunning) startGame();
            });
        });

        overlayButton.addEventListener('click', startGame);
        startButton.addEventListener('click', toggleGame);
        restartButton.addEventListener('click', () => {
            clearInterval(gameTimer);
            resetGame();
            startGame();
        });

        resetGame();
    </script>
</body>
</html>
