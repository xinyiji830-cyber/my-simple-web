<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* --- 这里的 CSS 负责页面的美观 --- */
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 90%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p.bio {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: #eff6ff;
        }

        /* 一个简单的动画效果 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .avatar {
            width: 120px;
            height: 120px;
            background-color: #ddd;
            border-radius: 50%;
            margin: 0 auto 20px;
            background-image: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'); /* 随机头像 */
            background-size: cover;
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar"></div>

        <h1>你好，我是新怡 👋</h1>
        
        <p class="bio">
            欢迎来到我的个人主页！<br>
            这是一个完全由 HTML 单文件生成的页面。<br>
            我正在学习如何使用 GitHub 和 AI 协同工作。
        </p >

        <div class="btn-group">
            <a href=" " class="btn btn-primary" onclick="alert('你点击了联系我！')">联系我</a >
            <a href="https://github.com" target="_blank" class="btn btn-outline">我的 GitHub</a >
        </div>
    </div>

    <script>
        // --- 这里的 JS 负责简单的交互 ---
        console.log("页面加载成功！欢迎来到控制台。");
    </script>

</body>
</html>
