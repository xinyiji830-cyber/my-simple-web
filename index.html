<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Divination - 全知占卜</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定义一些神秘的动画和背景 */
        body {
            background-color: #0f172a; /* 深蓝背景 */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .mystic-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .mystic-card:hover {
            transform: translateY(-5px);
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 10px 30px -10px rgba(167, 139, 250, 0.3);
        }
        .fade-in {
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- 占卜主程序 ---
        function App() {
            const [mode, setMode] = useState('home'); // home, tarot, iching
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);

            // 模拟塔罗牌数据
            const tarotCards = [
                { name: "愚者 (The Fool)", meaning: "新的开始，冒险，天真，潜力无限。" },
                { name: "魔术师 (The Magician)", meaning: "创造力，技能，意志力，自信。" },
                { name: "女祭司 (The High Priestess)", meaning: "直觉，潜意识，神秘，智慧。" },
                { name: "命运之轮 (Wheel of Fortune)", meaning: "命运的转折，变化，好运，循环。" },
                { name: "太阳 (The Sun)", meaning: "快乐，成功，积极，活力。" },
                { name: "月亮 (The Moon)", meaning: "幻觉，恐惧，潜意识，不安。" },
                { name: "星星 (The Star)", meaning: "希望，灵感，宁静，精神力量。" }
            ];

            // 占卜逻辑
            const performDivination = (type) => {
                setLoading(true);
                setResult(null);
                
                // 模拟神秘的计算过程 (等待2秒)
                setTimeout(() => {
                    if (type === 'tarot') {
                        const randomCard = tarotCards[Math.floor(Math.random() * tarotCards.length)];
                        setResult({ title: randomCard.name, desc: randomCard.meaning, icon: "🎴" });
                    } else if (type === 'iching') {
                        setResult({ title: "谦卦 (第15卦)", desc: "亨通，君子有终。保持谦虚将带来好运。", icon: "☯️" });
                    }
                    setLoading(false);
                }, 2000);
            };

            const reset = () => {
                setMode('home');
                setResult(null);
            };

            // --- 界面 1: 首页 ---
            if (mode === 'home') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center fade-in">
                        <div className="mb-8 text-6xl">🔮</div>
                        <h1 className="text-4xl md:text-6xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                            Omni Divination
                        </h1>
                        <p className="text-slate-400 mb-12 max-w-md text-lg">
                            探索古老的智慧，寻求内心的指引。<br/>请选择一种方式开启您的旅程。
                        </p >
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                            <button 
                                onClick={() => { setMode('tarot'); performDivination('tarot'); }}
                                className="mystic-card p-8 rounded-2xl cursor-pointer group"
                            >
                                <div className="text-4xl mb-4 group-hover:scale-110 transition-transform">🎴</div>
                                <h3 className="text-2xl font-bold mb-2">塔罗牌</h3>
                                <p className="text-slate-400">西方神秘学智慧，揭示当下的能量。</p >
                            </button>

                            <button 
                                onClick={() => { setMode('iching'); performDivination('iching'); }}
                                className="mystic-card p-8 rounded-2xl cursor-pointer group"
                            >
                                <div className="text-4xl mb-4 group-hover:scale-110 transition-transform">☯️</div>
                                <h3 className="text-2xl font-bold mb-2">易经</h3>
                                <p className="text-slate-400">东方变化哲学，指引行动的方向。</p >
                            </button>
                        </div>
                    </div>
                );
            }

            // --- 界面 2: 占卜中/结果页 ---
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 fade-in">
                    <button onClick={reset} className="absolute top-6 left-6 text-slate-400 hover:text-white flex items-center gap-2">
                        <span>⬅️</span> 返回首页
                    </button>

                    {loading ? (
                        <div className="text-center">
                            <div className="text-6xl animate-bounce mb-6">🔮</div>
                            <h2 className="text-2xl font-light tracking-widest animate-pulse">
                                连接宇宙能量中...
                            </h2>
                        </div>
                    ) : (
                        <div className="mystic-card max-w-lg w-full p-8 rounded-3xl text-center border-t-4 border-purple-500 shadow-2xl">
                            <div className="text-6xl mb-6">{result.icon}</div>
                            <h2 className="text-3xl font-bold mb-4 text-purple-300">{result.title}</h2>
                            <div className="h-px w-24 bg-purple-500/50 mx-auto mb-6"></div>
                            <p className="text-xl text-slate-200 leading-relaxed mb-8">
                                {result.desc}
                            </p >
                            <button 
                                onClick={reset}
                                className="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-full font-bold transition-all shadow-lg hover:shadow-purple-500/30"
                            >
                                再次占卜
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
